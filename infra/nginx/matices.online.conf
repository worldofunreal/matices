server {
    listen 80;
    server_name matices.online www.matices.online;
    return 301 https://matices.online$request_uri;
}

server {
    listen 443 ssl;
    server_name www.matices.online;

    include snippets/cloudflare-origin.conf;

    ssl_certificate     /usr/local/etc/nginx/self-signed.crt;
    ssl_certificate_key /usr/local/etc/nginx/self-signed.key;
    include snippets/ssl-params.conf;

    return 301 https://matices.online$request_uri;
}

server {
    listen 443 ssl;
    server_name matices.online;

    include snippets/cloudflare-origin.conf;

    ssl_certificate     /usr/local/etc/nginx/self-signed.crt;
    ssl_certificate_key /usr/local/etc/nginx/self-signed.key;
    include snippets/ssl-params.conf;

    root /var/www/matices.online/current;
    index index.html;

    # Vite output with a hash in the name (js/*-abc123.js): cache forever.
    location ^~ /js/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Event server (servidor/servidor.ts): the game's events and the dashboard's data.
    location /api/ {
        proxy_pass http://127.0.0.1:3200;
        proxy_set_header Host $host;
        client_max_body_size 4m;
    }

    # The dashboard.
    location = /admin {
        add_header Cache-Control "no-cache";
        try_files /admin.html =404;
    }

    # Art (assets/), maps and the page keep their names when replaced: always revalidate.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
