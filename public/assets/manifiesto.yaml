# Lista de todo el arte del juego. Cada pieza es un PNG en esta carpeta con el nombre y la medida
# que dice aquí. Para poner el arte final, se reemplaza el archivo provisional por otro con el
# mismo nombre y la misma medida; el juego no compila si una medida no cuadra.
# Reglas de dibujo y entrega: docs/arte/direccion-de-arte.md.
#
# Hojas de personaje: 5 columnas (quieto, paso 1 a 4) × 4 filas (abajo, izquierda, derecha, arriba),
# cuadros de 32 × 48, pies en la misma fila de píxeles en todos los cuadros.

# Piel, cabello y mochila se dibujan con los colores "clave" (claro, medio, sombra). El juego cambia
# esos tres colores por los del tono o color elegido. Los colores clave son los de la variante 1.
colores:
  piel:
    clave: ["#f6d7bd", "#e2b896", "#c4936f"]
    variantes:
      - ["#f6d7bd", "#e2b896", "#c4936f"]
      - ["#efc6a2", "#d9a87f", "#b9845c"]
      - ["#e2b088", "#c9946b", "#a6714b"]
      - ["#d19c6e", "#b78055", "#93603b"]
      - ["#bd8458", "#a06a42", "#7d4f2d"]
      - ["#a26b42", "#865532", "#663d21"]
      - ["#81512f", "#683f23", "#4c2c17"]
      - ["#5e3a22", "#4b2c19", "#341d10"]
  cabello:
    clave: ["#4a3426", "#33231a", "#21160f"]
    variantes:
      - ["#4a3426", "#33231a", "#21160f"]
      - ["#2a2422", "#1b1716", "#100d0c"]
      - ["#6b4a33", "#503524", "#362317"]
      - ["#9a6d46", "#7a5233", "#583a23"]
      - ["#d1a868", "#b08547", "#87622f"]
      - ["#a5532f", "#83401f", "#5e2c14"]
  mochila:
    clave: ["#5b8fd6", "#3f6fb3", "#2b4f85"]
    variantes:
      - ["#5b8fd6", "#3f6fb3", "#2b4f85"]
      - ["#e0605a", "#bf4540", "#8f2f2b"]
      - ["#6cbf6a", "#4c9a4a", "#356f34"]
      - ["#f2c14e", "#d19e2f", "#9c741d"]

