          prompt: |-
            The attached image is a pixel art game character, a child of about 9, standing still and facing the viewer, on a flat magenta background. Draw a NEW character in exactly the same art style: the same pixel size, the same dark outline, the same flat colors with soft shading, the same chibi proportions, the same kind of face and eyes, and the same skin color. The new character: La Cuentera, the storyteller, an older lady of about 70 with a long gray braid and round glasses, a dark-blue rebozo (Mexican shawl) over her shoulders, holding a big storybook. Standing still, facing the viewer, arms relaxed at the sides, full body from head to feet. It is taller than the child: about 1.25 times the child's height, with the head about the same size as the child's and a longer body, standing on the same floor line as the child. Plain everyday Mexican clothes; no beige, brown, orange or pink clothes or shoes, so they never look like skin. Hair in its real color. Do NOT draw the child: create ONE image the same size as the attached one, with ONLY the new character, centered. Flat solid magenta background (#FF00FF), fully opaque, never transparent. No text, no floor shadow, no extra objects.
