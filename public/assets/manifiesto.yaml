# Lista de todo el arte del juego. Cada pieza es un PNG en esta carpeta con el nombre y la medida
# que dice aquí. Para poner el arte final, se reemplaza el archivo provisional por otro con el
# mismo nombre y la misma medida; el juego no compila si una medida no cuadra.
# Reglas de dibujo y entrega: docs/arte/direccion-de-arte.md.
#
# Hojas del protagonista: 5 columnas (quieto, paso 1 a 4) × 3 filas (abajo, izquierda, arriba),
# cuadros de 48 × 64 (anchos para que quepa el cabello abultado); la derecha es la izquierda volteada, pies en la misma fila de píxeles en todos los cuadros. Es el único que camina:
# las figuras de la casa y los personajes fijos son un solo cuadro de 48 × 64, de pie y de frente.

# Piel, cabello, ropa, tenis y extras llevan los colores "clave" de su rampa (de claro a sombra; la piel lleva 5).
# El juego cambia esos colores por los del tono o color elegido. Los colores clave son los de la variante 1.
# Cada pieza dice su rampa en `colores`. Las capas se recortan con herramientas/acomodar.ts, que deja cada
# pieza en su clave aunque se haya dibujado en otro color.
colores:
  piel:
    clave: ["#ffead4", "#f6d7bd", "#e2b896", "#c4936f", "#af7954"]
    variantes:
      - ["#ffead4", "#f6d7bd", "#e2b896", "#c4936f", "#af7954"]
      - ["#fcd8b7", "#efc6a2", "#d9a87f", "#b9845c", "#a36b44"]
      - ["#f1c199", "#e2b088", "#c9946b", "#a6714b", "#8e5835"]
      - ["#e1ad7d", "#d19c6e", "#b78055", "#93603b", "#7a4a29"]
      - ["#ce9465", "#bd8458", "#a06a42", "#7d4f2d", "#643c1e"]
      - ["#b3784c", "#a26b42", "#865532", "#663d21", "#502c15"]
      - ["#905c36", "#81512f", "#683f23", "#4c2c17", "#381f0f"]
      - ["#694227", "#5e3a22", "#4b2c19", "#341d10", "#24120a"]
  cabello:
    clave: ["#4a3426", "#33231a", "#21160f"]
    variantes:
      - ["#4a3426", "#33231a", "#21160f"]
      - ["#2a2422", "#1b1716", "#100d0c"]
      - ["#6b4a33", "#503524", "#362317"]
      - ["#9a6d46", "#7a5233", "#583a23"]
      - ["#d1a868", "#b08547", "#87622f"]
      - ["#a5532f", "#83401f", "#5e2c14"]
  mochila:
    clave: ["#5b8fd6", "#3f6fb3", "#2b4f85"]
    variantes:
      - ["#5b8fd6", "#3f6fb3", "#2b4f85"]
      - ["#e0605a", "#bf4540", "#8f2f2b"]
      - ["#6cbf6a", "#4c9a4a", "#356f34"]
      - ["#f2c14e", "#d19e2f", "#9c741d"]
  sueter:
    clave: ["#4e4e56", "#3c3c44", "#2e2e35"]
    variantes:
      - ["#4e4e56", "#3c3c44", "#2e2e35"]
      - ["#2f3f6e", "#24315a", "#1a2445"]
      - ["#7a2a35", "#5f1f29", "#46161e"]
      - ["#2f5a3e", "#234630", "#183323"]
      - ["#6a4a33", "#533926", "#3d291b"]
  uniforme_abajo:
    clave: ["#96969c", "#7a7a82", "#62626a"]
    variantes:
      - ["#96969c", "#7a7a82", "#62626a"]
      - ["#3a4a78", "#2c3a62", "#202b4b"]
      - ["#b09a6e", "#927e56", "#736240"]
      - ["#3a3a3e", "#2c2c30", "#1f1f22"]
  playera:
    clave: ["#1f7a7a", "#16605f", "#0f4746"]
    variantes:
      - ["#1f7a7a", "#16605f", "#0f4746"]
      - ["#c8433d", "#a2322d", "#78241f"]
      - ["#e8c040", "#c49c2a", "#94741c"]
      - ["#7d4fb0", "#623b8f", "#482a6b"]
      - ["#e47fa6", "#c76189", "#9a4668"]
      - ["#3f78c8", "#2f5fa4", "#22467b"]
  pants:
    clave: ["#55585c", "#424548", "#313336"]
    variantes:
      - ["#55585c", "#424548", "#313336"]
      - ["#34508a", "#283f6f", "#1d2f54"]
      - ["#2f2f33", "#232327", "#18181b"]
      - ["#6b5040", "#543e31", "#3e2d23"]
  tenis:
    clave: ["#f2f2f2", "#cfcfcf", "#9a9a9a"]
    variantes:
      - ["#f2f2f2", "#cfcfcf", "#9a9a9a"]
      - ["#3a3a3e", "#2a2a2e", "#1c1c1f"]
      - ["#d0453f", "#a8332e", "#7a2420"]
      - ["#4a7fd0", "#3765ab", "#274a80"]
  gorra:
    clave: ["#d23c3c", "#ab2e2e", "#7f2121"]
    variantes:
      - ["#d23c3c", "#ab2e2e", "#7f2121"]
      - ["#3b6cc4", "#2d55a0", "#203e77"]
      - ["#3f9a4e", "#2f7a3c", "#215a2b"]
      - ["#36363a", "#27272b", "#1a1a1d"]
      - ["#e8c23e", "#c49e28", "#93761a"]
  lentes:
    clave: ["#5e676a", "#4a5255", "#373d40"]
    variantes:
      - ["#5e676a", "#4a5255", "#373d40"]
      - ["#2a2a2e", "#1f1f22", "#141416"]
      - ["#b8403a", "#92302b", "#6a221f"]
      - ["#3e6fb8", "#2f5793", "#22406c"]
  aretes:
    clave: ["#f2c64a", "#d1a12e", "#9c761c"]
    variantes:
      - ["#f2c64a", "#d1a12e", "#9c761c"]
      - ["#e2e6ea", "#b8bec4", "#868c92"]
      - ["#e0504a", "#b83a35", "#882a26"]

