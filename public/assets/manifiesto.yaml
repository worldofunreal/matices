    tipo: hoja
    medida: [ 240, 192 ]
    colores: [ piel, cabello ]
    piezas:
      cuerpo_nina: Cuerpo base de niña, 8 a 12 años, playera y short ajustados gris claro, descalza y sin cabello; piel con los colores clave
      cuerpo_nino: Cuerpo base de niño, igual que el de niña
      cabello_01: Largo lacio
      cabello_02: Largo chino
      cabello_03: Trenzas
      cabello_04: Dos coletas
      cabello_05: Cola de caballo
      cabello_06: Corto lacio
      cabello_07: Corto chino
      cabello_08: Rapado
      cabello_09: Afro
      cabello_10: Con fleco
      ropa_uniforme_arriba: { que: Suéter liso con playera blanca tipo polo, colores: [ sueter ] }
      ropa_uniforme_pantalon: { que: Pantalón del uniforme, colores: [ uniforme_abajo ] }
      ropa_uniforme_falda: { que: Falda a la rodilla con short, colores: [ uniforme_abajo ] }
      ropa_casa_arriba: { que: Playera de casa, colores: [ playera ] }
      ropa_casa_abajo: { que: Pants de casa, colores: [ pants ] }
      calzado_tenis: { que: Tenis, colores: [ tenis ] }
      extra_lentes: { que: Lentes, colores: [ lentes ] }
      extra_aretes: { que: Aretes pequeños, colores: [ aretes ] }
      extra_gorra: { que: Gorra, colores: [ gorra ] }
      extra_mochila: { que: Mochila, colores: [ mochila ] }

