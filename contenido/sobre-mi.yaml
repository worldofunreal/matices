# Sobre mí · los gemelos Tito y Tita (día 3)
# Cada frase tiene su versión A y B opuestas. El lado (Tito o Tita) se baraja por niño.
# Respuestas posibles: A, B, AMBOS, AHORA_NO.
# Redacción propia del equipo; no son reactivos de la BPI ni de la MNBS-CR. Pendiente de revisión clínica.
aviso: "Ahora no es un cuento. Es sobre ti. Escucha a Tito y a Tita y toca al que se parece más a ti."
