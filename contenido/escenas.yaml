    donde: biblioteca_planta_alta
    al: cuentera
    dia: 3
    hora: tarde
    sugerida: true
    saltable: true
    areas: [apoyo_emocional]
    pasos:
      - de: cuentera
        texto: Voy a leer un cuento de una niña que construía puentes. ¿Te quedas a escuchar?
      - titulo: ¿Te quedas?
        opciones:
          - [ACEPTA, "Sí, me quedo.", "Siéntate donde quieras."]
          - [PREGUNTA, "¿De qué se tratan los puentes?", "De cómo llegar a donde una quiere ir. Ya verás."]
          - [SE_RETIRA, "Ahorita no, gracias.", "Aquí leo todas las tardes.", cierra]
      - de: cuentera
        texto: La niña quería cruzar el río, pero sola no podía cargar las piedras.
      - de: cuentera
        texto: Un día le pidió a su vecino que le ayudara con una piedra. Al otro día eran tres.
      - de: cuentera
        texto: Y así, piedra por piedra, el puente llegó al otro lado.
      - titulo: ¿Qué piensas del cuento?
        opciones:
          - [EXPRESA_AGRADO, "Me gustó el final.", "A mí también."]
          - [PREGUNTA, "¿Y si nadie le hubiera ayudado?", "Buena pregunta. ¿Tú qué crees?"]
          - [COMPARTE, "Yo también he pedido ayuda.", "Gracias por contármelo."]
          - [CALLA, "Quedarme pensando.", "Tómate tu tiempo."]
