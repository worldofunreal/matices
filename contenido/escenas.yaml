# Escenas del demo: el guion de Dayana (RPG_Salud_Mental_Guiones_Arte.pdf) hecho datos. Formato y
# reglas en contenido/README.md; códigos de las opciones en contenido/codigos.md.
escenas:
  - id: T03
    nombre: Despertar en la habitación
    donde: casa
    al: entrar
    dia: 1
    hora: manana
    ensena: salto
    areas:
      - necesidades_fisicas
    pasos:
      - de: pensamiento
        texto: No he comido nada. Voy a la cocina a ver qué hay de desayunar.
  - id: T04
    nombre: El calendario de pared
    donde: casa
    al: calendario
    dia: 1
    hora: manana
    areas:
      - escuela_aprendizaje
    pasos:
      - de: pensamiento
        texto: Hoy es jueves. Me toca clase de educación física.
      - marca: vio_calendario
  - id: T05
    nombre: Conversación con la madre
    donde: casa
    al: mama
    dia: 1
    hora: manana
    no:
      - saco_huevos
    areas:
      - necesidades_fisicas
      - pedir_ayuda
      - apoyo_emocional
    pasos:
      - de: madre
        texto: ¡Buenos días! Se me hizo un poco tarde y ya salgo a trabajar.
      - de: yo
        texto: Buenos días, mamá. ¿Dejaste algo listo para desayunar?
      - de: madre
        texto: Hay huevos en la cocina. Prepárate algo rápido antes de irte.
      - titulo: ¿Qué le respondes?
        opciones:
          - - ACEPTA
            - Está bien, mamá. Que te vaya bien.
            - Gracias. Nos vemos más tarde.
          - - PREGUNTA
            - ¿Mañana podemos desayunar juntos?
            - Voy a intentar organizarme, ¿sí?
          - - PIDE_AYUDA
            - ¿Podrías ayudarme antes de irte?
            - Hoy ya no alcanzo. Dejé todo en la cocina.
          - - EXPRESA_MALESTAR
            - No tengo muchas ganas de cocinar.
            - Hay algo sencillo en la cocina. Al rato hablamos.
      - de: pensamiento
        texto: Últimamente mamá no tiene tiempo para desayunar conmigo.
      - marca: hablo_mama
  - id: T05b
    nombre: Conversación con la madre, con los huevos ya sacados
    donde: casa
    al: mama
    dia: 1
    hora: manana
    si:
      - saco_huevos
    no:
      - hablo_mama
    areas:
      - necesidades_fisicas
      - apoyo_emocional
    pasos:
      - de: madre
        texto: ¡Buenos días! Veo que ya sacaste los huevos. Prepárate algo rápido antes de irte.
      - de: yo
        texto: Gracias, mamá. Ya casi estoy list{o} para salir.
      - de: pensamiento
        texto: Mamá tampoco se sienta a desayunar conmigo. Ya tengo con qué desayunar.
      - marca: hablo_mama
  - id: T06
    nombre: El refrigerador
    donde: casa
    al: refrigerador
    dia: 1
    hora: manana
    areas:
      - necesidades_fisicas
    pasos:
      - minijuego: refri
      - de: sistema
        titulo: Huevos listos
        texto: Encontraste los huevos. Ahora puedes cocinarlos en la estufa.
      - marca: saco_huevos
  - id: T07
    nombre: Preparar el desayuno
    donde: casa
    al: estufa
    dia: 1
    hora: manana
    tras: T06
    areas:
      - necesidades_fisicas
      - apoyo_emocional
    pasos:
      - minijuego: estufa
      - de: pensamiento
        texto: Hoy tampoco alcanzó a sentarse conmigo a la mesa.
      - de: pensamiento
        texto: Mejor termino de comer rápido para no llegar tarde a clases.
      - de: sistema
        titulo: Alarma escolar
        texto: "Sonó la alarma: es hora de ponerte el uniforme en tu cuarto."
  - id: T08
    nombre: Elegir la ropa
    donde: casa
    al: ropero
    dia: 1
    hora: manana
    tras: T07
    areas:
      - conducta
      - escuela_aprendizaje
    pasos:
      - minijuego: ropero
  - id: R-estufa
    nombre: Antes de salir, la estufa prendida
    donde: casa
    al: salir:calle
    si:
      - estufa_prendida
    no:
      - estufa_apagada
    frena: true
    pasos:
      - de: pensamiento
        texto: Dejé la lumbre prendida en la cocina. Debo apagarla antes de salir.
  - id: A-estufa
    nombre: Apagar la estufa
    donde: casa
    al: estufa
    si:
      - estufa_prendida
    no:
      - estufa_apagada
    pasos:
      - de: pensamiento
        texto: Giro la perilla y apago la estufa.
      - marca: estufa_apagada
  - id: C-estufa
    nombre: Al volver, la comida quemada
    donde: casa
    al: entrar
    hora: noche
    si:
      - estufa_prendida
    no:
      - consecuencia_estufa
      - estufa_apagada
    pasos:
      - efecto: inquietud
      - de: pensamiento
        texto: Huele a humo en toda la casa. El sartén se quemó en la estufa.
      - de: mensaje_mama
        texto: Me avisaron del humo y vine a apagar la estufa. Límpialo, por favor.
      - marca: estufa_apagada
      - marca: consecuencia_estufa
  - id: L-sarten
    nombre: Lavar el sartén quemado
    donde: casa
    al: fregadero
    si:
      - consecuencia_estufa
    no:
      - limpio_estufa
    pasos:
      - de: pensamiento
        texto: Pongo jabón y lavo el sartén quemado en el fregadero.
      - marca: limpio_estufa
  - id: R-sarten
    nombre: Antes de salir, el sartén quemado
    donde: casa
    al: salir:calle
    si:
      - consecuencia_estufa
    no:
      - limpio_estufa
    frena: true
    pasos:
      - de: pensamiento
        texto: Antes de salir a la calle, tengo que lavar el sartén quemado.
  - id: C-sarten
    nombre: Al volver, el sartén sin lavar
    donde: casa
    al: entrar
    si:
      - consecuencia_estufa
    no:
      - limpio_estufa
    pasos:
      - de: pensamiento
        texto: El sartén quemado sigue en el fregadero.
  - id: T09
    nombre: Salir de casa
    donde: casa
    al: salir:calle
    dia: 1
    hora: manana
    tras: T08
    areas:
      - escuela_aprendizaje
    pasos:
      - de: pensamiento
        texto: Hoy veré cómo va el día con mis compañeros.
      - de: sistema
        titulo: Camino libre
        texto: Ya puedes explorar el pueblo, platicar con gente y entrar a la escuela.
  - id: U01a
    nombre: Revisión del uniforme, con ropa de deporte
    donde: escuela_planta_baja
    al: entrar
    dia: 1
    hora: manana
    si:
      - ropa_deporte
    areas:
      - escuela_aprendizaje
      - conducta
    pasos:
      - de: lucia
        texto: ¡Buenos días! ¿Vienes list{o} para educación física?
  - id: U01b
    nombre: Revisión del uniforme, con otra ropa
    donde: escuela_planta_baja
    al: entrar
    dia: 1
    hora: manana
    no:
      - ropa_deporte
    areas:
      - conducta
      - escuela_aprendizaje
      - prosocial
    pasos:
      - de: lucia
        texto: Buenos días. Hoy toca educación física. Si no trajiste ropa deportiva, puedes jugar con la ropa que traes.
      - titulo: ¿Qué le respondes a la maestra?
        opciones:
          - - ACEPTA
            - Sí, quiero participar.
            - Te explico la actividad.
          - - PREGUNTA
            - ¿Qué puedo hacer sin cambiarme?
            - Puedes ayudar a contar puntos y pasar balones.
          - - EVITA
            - Prefiero quedarme en mi lugar.
            - De acuerdo. Puedes ver desde la banca.
  - id: R01
    nombre: Primer recreo
    donde: escuela_planta_baja
    al: entrar
    dia: 1
    hora: manana
    tras:
      - U01a
      - U01b
    areas:
      - companeros
    pasos:
      - de: pensamiento
        texto: Todavía no conozco bien a nadie aquí. Voy a buscar con quién hablar.
  - id: R02-valeria
    nombre: Valeria y la cuerda
    donde: escuela_planta_baja
    al: companero_1
    dia: 1
    hora: manana
    tras: R01
    sugerida: true
    saltable: true
    areas:
      - companeros
      - prosocial
    pasos:
      - de: valeria
        texto: ¡Hola! Nos falta una persona para saltar la cuerda. ¿Quieres jugar?
      - titulo: ¿Entras a jugar con Valeria?
        opciones:
          - - ACEPTA
            - ¡Claro! ¿Cómo van las reglas?
            - Solo saltas al ritmo. ¿Entras?
          - - ACEPTA
            - No juego muy bien, pero le entro.
            - No pasa nada. Aquí te enseñamos.
          - - POSPONE
            - Tal vez al rato.
            - Está bien. Aquí seguimos jugando.
            - cierra
      - minijuego: cuerda
      - de: valeria
        texto: ¡Estuvo divertido! ¿Jugamos juntos en el recreo de mañana?
      - titulo: ¿Qué le dices a Valeria?
        opciones:
          - - ACEPTA
            - Sí, me gustaría jugar otra vez.
            - Te busco en el patio.
          - - PROPONE
            - Podemos probar otro juego.
            - ¿Cuál se te ocurre?
          - - EVITA
            - A veces prefiero caminar, pero platicamos.
            - Claro, cuando quieras.
      - marca: conocio_valeria
  - id: R02-leo
    nombre: Leo y el dibujo
    donde: escuela_planta_baja
    al: companero_2
    dia: 1
    hora: manana
    tras: R01
    sugerida: true
    saltable: true
    areas:
      - companeros
      - prosocial
    pasos:
      - de: leo
        texto: Estoy pintando este dibujo del patio. ¿Me ayudas a terminarlo?
      - titulo: ¿Ayudas a Leo con el dibujo?
        opciones:
          - - ACEPTA
            - Sí, me gusta mucho dibujar.
            - Pinta el cielo y las bancas.
          - - PREGUNTA
            - ¿Qué estás dibujando?
            - Un paisaje del patio con la cancha de básquet.
          - - EVITA
            - Prefiero seguir caminando.
            - Está bien. Aquí me quedo dibujando.
            - cierra
      - minijuego: dibujo
      - marca: conocio_leo
  - id: R02-sam
    nombre: Sam y la libreta perdida
    donde: escuela_planta_baja
    al: companero_3
    dia: 1
    hora: manana
    tras: R01
    sugerida: true
    saltable: true
    areas:
      - companeros
      - prosocial
      - escuela_aprendizaje
    pasos:
      - de: sam
        texto: Encontré algo en el patio. Alguien perdió su libreta de apuntes.
      - titulo: ¿Ayudas a Sam a investigar?
        opciones:
          - - ACEPTA
            - Vamos a buscar de quién es.
            - Revisemos las pistas juntos.
          - - PREGUNTA
            - ¿Dónde la viste?
            - Junto a la jardinera, cerca de la canasta.
          - - EVITA
            - Ahorita tengo otra cosa que hacer.
            - Sale. Te aviso si encuentro al dueño.
            - cierra
      - minijuego: pistas
      - marca: conocio_sam
  - id: C03
    nombre: ¿Me ayudas con las compras?
    donde: calle
    al: entrar
    dia: 1
    hora: tarde
    areas:
      - prosocial
      - cuidar_de_mas
      - supervision
    pasos:
      - de: madre
        texto: ¿Me ayudas a comprar? Faltan cosas para la comida en la tiendita.
      - titulo: ¿Qué le dices a mamá?
        opciones:
          - - ACEPTA
            - ¡Claro! ¿Qué hace falta?
            - Aquí tienes la lista y el dinero.
          - - PREGUNTA
            - ¿Puedo ir al acabar mi tarea?
            - Sí, pero no tardes en volver.
          - - PIDE_AYUDA
            - Sí voy, pero dame la lista.
            - Aquí la tienes. Regresa pronto a casa.
      - minijuego: tienda
      - marca: compras
  - id: X01
    nombre: ¡Hoy toca examen!
    donde: escuela_planta_baja
    al: entrar
    dia: 2
    hora: manana
    areas:
      - escuela_aprendizaje
      - sintomas_emocionales
    pasos:
      - de: lucia
        texto: Buenos días. Hoy tenemos el examen que repasamos. Guarden sus cosas.
      - de: pensamiento
        texto: ¡Es cierto, el examen! Espero acordarme bien de lo que estudié.
      - titulo: ¿Cómo te sientes con el examen?
        opciones:
          - - ACEPTA
            - ¡Estoy list{o}!
            - Mucho éxito con tus respuestas.
            - tranquilidad
          - - EXPRESA_MALESTAR
            - Tengo un poco de nervios.
            - Respira con calma. Lee cada pregunta con tiempo.
            - nervios
          - - EXPRESA_MALESTAR
            - Debí repasar un poco más.
            - Contesta con calma lo que recuerdes.
            - nervios
          - - ACEPTA
            - Haré mi mejor esfuerzo.
            - Con eso es suficiente. Mucho éxito.
            - tranquilidad
      - minijuego: examen
  - id: R05
    nombre: Amistad que crece
    donde: escuela_planta_baja
    al: companero_2
    dia: 2
    hora: manana
    si:
      - conocio_leo
    areas:
      - companeros
      - apoyo_emocional
      - pedir_ayuda
    pasos:
      - de: leo
        texto: ¿Te acuerdas del dibujo que empezamos? Hoy podemos acabarlo.
      - de: leo
        texto: ¿Quieres jugar o platicamos en la banca?
      - titulo: ¿Qué prefieres hacer con Leo?
        opciones:
          - - ACEPTA
            - Sí, vamos a jugar.
            - ¡Vámonos a la cancha!
          - - COMPARTE
            - Prefiero platicar un rato.
            - Claro, vamos a sentarnos a la banca.
          - - EVITA
            - No tengo muchas ganas de hablar.
            - Está bien. Aquí estoy por si cambias de opinión.
            - tristeza
          - - EXPRESA_MALESTAR
            - Traigo algo que me preocupa.
            - Cuéntame con confianza, te escucho.
            - nervios
      - marca: hablo_leo
  - id: R05b
    nombre: Leo, sin conocerlo antes
    donde: escuela_planta_baja
    al: companero_2
    dia: 2
    hora: manana
    no:
      - conocio_leo
    areas:
      - companeros
      - prosocial
    pasos:
      - de: leo
        texto: Hola. Estoy pintando aquí en la banca. ¿Quieres sentarte con nosotros?
      - titulo: ¿Te sientas con Leo?
        opciones:
          - - ACEPTA
            - Sí, me siento un rato.
            - Aquí hay lugar.
          - - EVITA
            - Prefiero caminar un poco.
            - Está bien. Aquí andamos.
      - marca: hablo_leo
  - id: E2-01
    nombre: Un momento tranquilo
    donde: casa
    al: cama
    dia: 2
    hora: noche
    areas:
      - apoyo_emocional
    pasos:
      - minijuego: dibujo
      - de: pensamiento
        texto: Ya terminé el dibujo. Voy a enseñárselo a papá en la sala.
      - marca: dibujo_listo
  - id: E2-02
    nombre: Encuentro con el padre
    donde: casa
    al: papa
    dia: 2
    hora: noche
    si: [dibujo_listo]
    areas:
      - abuso_emocional
      - limites
      - representacion_adultos
    delicada: true
    saltable: true
    pasos:
      - efecto: inquietud
      - de: yo
        texto: Papá, mira lo que dibujé en mi cuaderno.
      - de: papa
        texto: ¿Otra vez perdiendo el tiempo con esos rayones?
      - de: yo
        texto: Lo terminé en mi tiempo libre después de la tarea.
      - de: papa
        texto: Deberías ponerte a hacer algo útil en vez de entretenerte con tonterías.
      - titulo: ¿Qué le contestas a papá?
        opciones:
          - - EXPRESA_AGRADO
            - A mí me gusta mucho dibujar.
            - null
          - - COMPARTE
            - Solo quería que lo vieras.
            - null
          - - PREGUNTA
            - ¿Por qué siempre me dices eso?
            - null
          - - CALLA
            - Quedarme callad{o}.
            - null
      - de: papa
        texto: Cuando hagas algo útil de verdad, vienes a enseñarme tus cosas.
      - de: papa
        texto: Y no pongas esa cara. Te digo las cosas por tu bien.
      - titulo: ¿Cómo reaccionas ante lo que dijo?
        opciones:
          - - EXPRESA_MALESTAR
            - Me hace sentir mal cómo me hablas.
            - null
            - tristeza
          - - DESACUERDO
            - No estoy de acuerdo con lo que dices.
            - null
          - - EVITA
            - No quiero pelear.
            - null
          - - SE_RETIRA
            - Darme la vuelta e irme a mi cuarto.
            - null
      - efecto: intensidad
      - de: papa
        texto: Con todo lo que te doy, al menos deberías agradecer que te corrija.
      - marca: visto_papa
  - id: E2-04
    nombre: Consecuencia emocional
    donde: casa
    al: cama
    dia: 2
    hora: noche
    si: [visto_papa]
    areas:
      - sintomas_emocionales
      - apoyo_emocional
    pasos:
      - efecto: acompanamiento
      - de: pensamiento
        texto: Antes de bajar a la sala, tenía el dibujo en mi cuaderno.
      - de: pensamiento
        texto: Ahora ya no sé si quiero que alguien más lo vea.
      - titulo: ¿Qué decides hacer con el dibujo?
        opciones:
          - - EVITA
            - Guardar el dibujo en un cajón.
            - null
          - - EXPRESA_AGRADO
            - Pegarlo en la pared de mi cuarto.
            - null
          - - EXPRESA_AGRADO
            - Seguir coloreándolo a mi gusto.
            - null
          - - COMPARTE
            - Enseñárselo mañana a un compañero.
            - null
  - id: E2-05
    nombre: Reconocimiento y apoyo
    donde: escuela_planta_baja
    al: companero_2
    dia: 3
    hora: manana
    si: [visto_papa]
    areas:
      - companeros
      - apoyo_emocional
    pasos:
      - efecto: alegria
      - de: leo
        texto: ¡Oye! ¿Ese dibujo lo hiciste tú?
      - de: yo
        texto: Sí, aunque en mi casa dijeron que era una tontería.
      - de: leo
        texto: ¿Y qué más dibujas?
      - marca: reconocio_dibujo
  - id: O01
    nombre: Hablar con la orientadora
    donde: escuela_planta_baja
    al: orientadora
    dia: 3
    hora: manana
    areas:
      - pedir_ayuda
      - representacion_adultos
      - apoyo_emocional
    delicada: true
    saltable: true
    pasos:
      - efecto: acompanamiento
      - de: yo
        texto: Maestra, ¿puedo hablar con usted a solas un momento?
      - de: orientadora
        texto: Claro. Pasa y cuéntame con toda calma qué pasó.
      - titulo: ¿Qué decides contarle a la orientadora?
        opciones:
          - - CUENTA
            - Me pasa algo difícil en mi casa.
            - Gracias por confiar en mí. Lo revisamos con calma.
          - - PREGUNTA
            - ¿Qué puedo hacer cuando me siento así?
            - Podemos buscar a personas de confianza para apoyarte.
          - - EVITA
            - No sé muy bien cómo explicarlo.
            - No tienes que decir todo hoy. Vamos a tu ritmo.
          - - SE_RETIRA
            - Prefiero regresar después.
            - Está bien. Aquí tienes la puerta abierta.
      - de: orientadora
        texto: Lo que sientes sí importa. Pensaremos juntos cómo ayudarte.
      - marca: hablo_orientadora
  - id: C02
    nombre: Un proyecto entre dos
    donde: escuela_planta_baja
    al: entrar
    dia: 3
    hora: manana
    areas:
      - companeros
      - escuela_aprendizaje
      - prosocial
    pasos:
      - de: lucia
        texto: Para mañana prepararán un proyecto en parejas. Elijan con quién trabajar.
      - de: valeria
        texto: Tengo una idea para armar el trabajo juntos. ¿Qué opinas?
      - titulo: ¿Qué le dices a Valeria para el trabajo?
        opciones:
          - - ACEPTA
            - Me late tu idea, hagámoslo así.
            - Empezamos a prepararlo.
          - - PROPONE
            - Tengo otra idea diferente.
            - A ver, platícamela.
          - - PROPONE
            - ¿Y si juntamos las dos ideas?
            - Lo combinamos.
      - marca: proyecto_pareja
  # Día 2, tarde: la tarea.
  - id: D2-tarea
    nombre: La tarea de la tarde
    donde: casa
    al: mesa
    dia: 2
    hora: tarde
    areas: [escuela_aprendizaje, supervision, pedir_ayuda]
    pasos:
      - de: pensamiento
        texto: Tengo tarea de matemáticas para mañana. Son diez problemas de fracciones.
      - titulo: ¿Qué haces?
        opciones:
          - [ACEPTA, "Hacerla ahorita en la mesa.", null]
          - [POSPONE, "Ver la tele un rato primero.", null]
          - [PIDE_AYUDA, "Mandarle un mensaje a mamá para que me ayude.", null]
          - [EVITA, "No hacerla.", null]
      - de: mensaje_mama
        texto: Estoy en el trabajo. Si no te sale un problema, márcalo y en la noche lo vemos.
      - titulo: ¿Cómo te va con la tarea?
        opciones:
          - [ACEPTA, "Me salen casi todos.", null, tranquilidad]
          - [EXPRESA_MALESTAR, "No le entiendo a las fracciones.", null, nervios]
          - [PREGUNTA, "Busco cómo se hacen en mi libro.", null]
          - [SE_RETIRA, "Cerrar el cuaderno e irme a mi cuarto.", null]
      - marca: tarea_dia2
  # Día 3, tarde y noche: el proyecto sigue en la biblioteca; la cena en casa.
  - id: D3-biblio
    nombre: Libros para el proyecto
    donde: biblioteca_planta_baja
    al: clara
    dia: 3
    hora: tarde
    areas: [escuela_aprendizaje, pedir_ayuda]
    pasos:
      - de: clara
        texto: Buenas tardes. ¿Buscas algo en especial?
      - de: yo
        texto: Necesito libros para un proyecto en parejas.
      - de: clara
        texto: Los de ciencias están en ese librero. Los cuentos, arriba.
      - titulo: ¿Qué haces?
        opciones:
          - [PIDE_AYUDA, "¿Me ayuda a encontrar uno?", "Claro. Dime de qué trata tu proyecto."]
