id: E02
titulo: No hay comida
dia: 2
intensidad: media
lugar: casa.cocina
hora: tarde
area_principal: necesidades_fisicas
areas: [supervision]
inicio: "{nombre} regresa de la escuela con mucha hambre. Abre el refrigerador y no hay comida lista."
pasos:
  - id: quien_llega
    pregunta: "¿Quién llega?"
    personas: [casa, vecino, nadie, solo]
  - id: que_hace
    pregunta: "¿Qué hace {quien}?"
    opciones:
      - [PROTEGE, "Le prepara algo de comer y comen juntos"]
      - [NOTA_SIN_ACTUAR, "Dice «hay galletas» y sigue en lo suyo"]
      - [RECHAZA, "Le dice que deje de pedir cosas"]
      - [DANA, "Cierra el refrigerador de golpe y manda a {nombre} a su cuarto"]
      - [AUSENTE, "Dice «ahorita vengo» y no regresa"]
    opciones_solo:
      - [AUTOSUFICIENTE, "{nombre} busca algo en la alacena y come sin compañía"]
      - [CUIDA_A_OTRO, "{nombre} prepara algo para él y para alguien más de la casa"]
      - [BUSCA_AYUDA, "{nombre} va con un vecino"]
      - [SE_QUEDA_QUIETO, "{nombre} se acuesta a esperar"]
  - id: luego
    pregunta: "¿Y luego?"
    opciones:
      - [PROTEGE, "En la noche cenan todos juntos"]
      - [AUTOSUFICIENTE, "{nombre} se va a dormir con hambre sin decir nada"]
      - [AUSENTE, "Nadie llega hasta muy tarde"]
      - [BUSCA_AYUDA, "{nombre} le cuenta a alguien que tenía hambre"]
    opciones_solo:
      - [PROTEGE, "Más tarde alguien llega y le da de cenar"]
      - [AUTOSUFICIENTE, "{nombre} se va a dormir con hambre sin decir nada"]
      - [AUSENTE, "Nadie llega hasta muy tarde"]
      - [BUSCA_AYUDA, "{nombre} le cuenta a alguien que tenía hambre"]
  - id: carita
