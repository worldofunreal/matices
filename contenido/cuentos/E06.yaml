id: E06
titulo: La tarea difícil
dia: 2
intensidad: baja
lugar: casa.sala
hora: tarde
area_principal: escuela_aprendizaje
areas: [pedir_ayuda]
inicio: "{nombre} tiene una tarea de matemáticas que no entiende. Mañana se entrega."
pasos:
  - id: quien_llega
    pregunta: "¿Quién llega?"
    personas: [casa, nadie, solo]
  - id: que_hace
    pregunta: "¿Qué hace {quien}?"
    opciones:
      - [PROTEGE, "Se sienta con {nombre} y le explica"]
      - [NOTA_SIN_ACTUAR, "Dice «luego la vemos» y no regresa"]
      - [RECHAZA, "Dice «eso ya deberías saberlo»"]
      - [DANA, "Le quita el cuaderno de mal modo"]
      - [AUSENTE, "Dice que tiene sueño y se va a dormir"]
    opciones_solo:
      - [AUTOSUFICIENTE, "{nombre} lo intenta sin ayuda hasta tarde"]
      - [BUSCA_AYUDA, "{nombre} va a preguntarle a alguien"]
      - [SE_QUEDA_QUIETO, "{nombre} guarda el cuaderno sin hacerla"]
  - id: luego
    pregunta: "¿Y luego?"
    opciones:
      - [PROTEGE, "Terminan la tarea juntos"]
      - [BUSCA_AYUDA, "Al día siguiente le pregunta a la maestra"]
      - [AUTOSUFICIENTE, "{nombre} la termina sin ayuda como puede"]
      - [AUSENTE, "La tarea se queda sin hacer"]
    opciones_solo:
      - [PROTEGE, "Más tarde alguien de su casa le ayuda"]
      - [BUSCA_AYUDA, "Al día siguiente le pregunta a la maestra"]
      - [AUTOSUFICIENTE, "{nombre} la termina sin ayuda como puede"]
      - [AUSENTE, "La tarea se queda sin hacer"]
  - id: carita
