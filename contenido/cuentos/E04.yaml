id: E04
titulo: El ruido de noche
dia: 2
intensidad: media
lugar: casa.recamara
hora: noche
area_principal: apoyo_emocional
areas: [supervision]
inicio: "Es de noche. {nombre} se despierta por un ruido raro y tiene miedo."
pasos:
  - id: quien_llega
    pregunta: "¿Quién llega?"
    personas: [casa, nadie, solo]
  - id: que_hace
    pregunta: "¿Qué hace {quien}?"
    opciones:
      - [PROTEGE, "Prende la luz, revisa y se queda hasta que {nombre} se duerme"]
      - [NOTA_SIN_ACTUAR, "Dice desde lejos «duérmete» y no viene"]
      - [RECHAZA, "Se enoja porque lo despertaron"]
      - [DANA, "Le grita y cierra la puerta de golpe"]
      - [AUSENTE, "No hay nadie despierto en la casa"]
    opciones_solo:
      - [AUTOSUFICIENTE, "{nombre} se tapa con la cobija y aguanta"]
      - [BUSCA_AYUDA, "{nombre} va al cuarto de alguien"]
      - [SE_QUEDA_QUIETO, "{nombre} se queda despierto sin moverse"]
  - id: luego
    pregunta: "¿Y luego?"
    opciones:
      - [PROTEGE, "Descubren que era el gato y se ríen"]
      - [AUTOSUFICIENTE, "{nombre} se duerme sin compañía con la luz prendida"]
      - [AUSENTE, "{nombre} no puede dormir en toda la noche"]
      - [BUSCA_AYUDA, "En la mañana {nombre} le cuenta a alguien"]
  - id: carita
