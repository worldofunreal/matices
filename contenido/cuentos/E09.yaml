id: E09
titulo: El recreo
dia: 1
intensidad: baja
lugar: escuela.cancha
hora: manana
area_principal: companeros
areas: [conducta, pedir_ayuda]
inicio: "Es la hora del recreo. {nombre} quiere jugar futbol, pero un compañero le dice: «Tú no juegas»."
pasos:
  - id: que_hace_protagonista
    pregunta: "¿Qué hace {nombre}?"
    opciones:
      - [SE_ENOJA, "Se enoja y le avienta la pelota"]
      - [SE_VA, "Se va a otro lado solo"]
      - [BUSCA_AYUDA, "Va con la maestra"]
      - [AUTOSUFICIENTE, "Busca a otros niños para jugar"]
      - [SE_QUEDA_QUIETO, "Se queda mirando sin decir nada"]
  - id: quien_llega
    pregunta: "¿Quién llega?"
    personas: [escuela, nadie]
  - id: que_hace
    pregunta: "¿Qué hace {quien}?"
    opciones:
      - [PROTEGE, "Le dice al grupo que todos pueden jugar"]
      - [NOTA_SIN_ACTUAR, "Ve lo que pasa y no dice nada"]
      - [RECHAZA, "Le dice a {nombre} que no sea chillón"]
      - [DANA, "Se burla de {nombre} enfrente de todos"]
      - [AUSENTE, "Pasa de largo"]
  - id: carita
