id: E14
titulo: El viaje
dia: 2
intensidad: media
lugar: casa.entrada
hora: tarde
area_principal: representacion_adultos
areas: [supervision, apoyo_emocional]
inicio: "Alguien de la casa de {nombre} se va de viaje varios días. Toma su maleta y abre la puerta."
pasos:
  - id: quien_se_va
    pregunta: "¿Quién se va?"
    personas: [casa]
  - id: despedida
    pregunta: "¿Cómo se despide?"
    opciones:
      - [PROTEGE, "Le da un abrazo y le dice cuándo regresa"]
      - [NOTA_SIN_ACTUAR, "Dice «adiós» desde la puerta"]
      - [RECHAZA, "Le dice que no le dé lata"]
      - [AUSENTE, "Se va sin despedirse"]
  - id: quien_cuida
    pregunta: "¿Quién cuida a {nombre} esos días?"
    personas: [casa, vecino, nadie, solo]
  - id: regreso
    pregunta: "Días después, regresa. ¿Qué pasa?"
    opciones:
      - [PROTEGE, "Abraza a {nombre} y le cuenta del viaje"]
      - [NOTA_SIN_ACTUAR, "Llega y se pone a ver la tele"]
      - [RECHAZA, "Llega de mal humor con todos"]
      - [AUSENTE, "No regresa el día que dijo"]
  - id: carita
