id: E10
titulo: El compañero que se cae
dia: 2
intensidad: baja
lugar: escuela.patio
hora: manana
area_principal: prosocial
areas: [pedir_ayuda]
inicio: "En el patio, un compañero de {nombre} se cae y empieza a llorar."
pasos:
  - id: que_hace_protagonista
    pregunta: "¿Qué hace {nombre}?"
    opciones:
      - [AYUDA_A_OTRO, "Le ayuda a levantarse"]
      - [BUSCA_AYUDA, "Corre a buscar a la maestra"]
      - [IGNORA_A_OTRO, "Sigue jugando"]
      - [SE_BURLA, "Se ríe"]
      - [SE_QUEDA_QUIETO, "Se queda mirando"]
  - id: quien_llega
    pregunta: "¿Quién llega?"
    personas: [escuela, nadie]
  - id: que_hace
    pregunta: "¿Qué hace {quien}?"
    opciones:
      - [PROTEGE, "Ayuda a {nombre} a levantarse y van a la enfermería"]
      - [NOTA_SIN_ACTUAR, "Le dice «no es para tanto»"]
      - [RECHAZA, "Le dice que deje de llorar"]
      - [DANA, "Regaña a {nombre} enfrente de todos"]
      - [AUSENTE, "No se da cuenta"]
  - id: carita
    pregunta: "¿Cómo se siente {nombre}?"
