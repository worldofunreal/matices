id: E08
titulo: Alguien en cama
dia: 3
intensidad: media
lugar: casa.recamara_adulto
hora: manana
area_principal: cuidar_de_mas
areas: [necesidades_fisicas, supervision]
inicio: "Alguien de la casa de {nombre} está en cama todo el día y no se levanta."
pasos:
  - id: quien_esta
    pregunta: "¿Quién está en cama?"
    personas: [casa_adultos]
  - id: que_hace_protagonista
    pregunta: "¿Qué hace {nombre}?"
    opciones:
      - [CUIDA_A_OTRO, "Le lleva agua y hace la comida para todos"]
      - [BUSCA_AYUDA, "Va a buscar a otro adulto"]
      - [AUTOSUFICIENTE, "Se hace su comida y se va a la escuela solo"]
      - [SE_QUEDA_QUIETO, "Se queda en su cuarto sin hacer ruido"]
  - id: quien_llega
    pregunta: "¿Quién se ocupa de la casa ese día?"
    personas: [casa, vecino, nadie, solo]
  - id: carita
