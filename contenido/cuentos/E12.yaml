id: E12
titulo: El hermanito
dia: 3
intensidad: media
lugar: casa.sala
hora: noche
area_principal: supervision
areas: [cuidar_de_mas]
nota: Si el niño no puso un hermano menor en la casa, aparece "su primito de visita".
inicio: "Los adultos de la casa van a salir. El hermanito de {nombre} se queda con {nombre}."
pasos:
  - id: salida
    pregunta: "¿Cómo se van?"
    opciones:
      - [PROTEGE, "Dejan a una persona adulta pendiente y regresan pronto"]
      - [NOTA_SIN_ACTUAR, "Dicen «ahí se cuidan» y se van"]
      - [AUSENTE, "Se van toda la noche sin decir a dónde"]
  - id: que_hace_protagonista
    pregunta: "¿Qué hace {nombre}?"
    opciones:
      - [CUIDA_A_OTRO, "Le da de cenar a su hermanito y lo duerme"]
      - [BUSCA_AYUDA, "Le llama a un adulto"]
      - [SE_ENOJA, "Le grita a su hermanito que se calle"]
      - [SE_QUEDA_QUIETO, "Prende la tele y espera"]
  - id: quien_llega
    pregunta: "¿Quién llega al final?"
    personas: [casa, vecino, nadie]
  - id: carita
