# Modo cuento (GDD §9). Las frases de La Cuentera son fijas: nunca opina sobre un final.
cuento:
  inicio: "Aquí empieza un cuento que perdió su final…"
  pregunta: "¿Y qué pasó después?"
  cierre: "Así queda el cuento. Gracias."
  ahora_no: "Está bien. Lo dejamos aquí."
  boton_ahora_no: "Ahora no"
  otra: "Otra cosa"
  no_se: "No sé"
  nadie: "Nadie"
  solo: "{nombre} lo resuelve sin ayuda"
  vecino: "Un vecino o vecina"
  escuela:
    maestra: "La maestra"
    companero: "Un compañero"
    conserje: "El conserje"
    directora: "La directora"
  carita: "¿Cómo se siente {nombre}?"
  caritas: ["Muy mal", "Mal", "Más o menos", "Bien", "Muy bien"]
  contar_mas: "Contar más"
  panel:
    cuerpo: "En el cuerpo"
    pensamiento: "En la cabeza"
    entorno: "Alrededor"
  estado: "¿Cómo se siente todo alrededor?"
  estados:
    tranquilo: "Tranquilo"
    inquieto: "Inquieto"
    alerta: "Alerta"
    saturado: "Demasiado"
  listo: "Listo"
  dibujar: "Dibuja lo que pasa."

# Actividades (GDD §10). La consigna del dibujo está pendiente de revisión clínica y la puede
# cambiar el psicólogo (docs/PENDIENTES.md).
actividades:
  cuentera:
    - "Hola, {nombre}. Yo soy La Cuentera."
    - "En mi libro hay cuentos que perdieron su final."
    - "Cuando pase algo en tu día, el libro se va a abrir y tú decides qué pasó después."
    - "Ningún final es el correcto. Y si no quieres seguir, tocas «Ahora no»."
  dibujo_libre: "Dibuja a todas las personas de tu casa haciendo algo."
  describir:
    inicio: "Mira este dibujo con calma."
    emociones:
      contento: "Feliz"
      tranquilo: "En calma"
      triste: "Triste"
      enojado: "Con enojo"
      asustado: "Con miedo"
      no_se: "No sé"
  sobre_mi:
    los_dos: "Los dos"
    ahora_no: "Ahora no"
    fin: "Gracias por contarme."
  seguir: "Seguir"
  aterrizaje:
    texto: "Antes de dormir, riega las plantas del patio. Toca cada maceta."
    adios: "Hasta mañana, {nombre}."
    adios_final: "Gracias por estos tres días, {nombre}."

