    piel: "¿De qué color es su piel?"
    cabello: "¿Cómo es su cabello?"
    color_cabello: "¿De qué color es su cabello?"
    ropa: "¿Qué ropa trae?"
    extras: "¿Algo más? Puedes elegir varios o ninguno."
    color_mochila: "¿De qué color es su mochila?"
    nombre: "¿Cómo se llama?"
  cuerpo:
    nina: "Niña"
    nino: "Niño"
    neutro: "Prefiero no elegir"
  ropa:
    uniforme_pantalon: "Uniforme con pantalón"
