# Textos fijos del juego (no los de los sucesos). Cada texto tiene voz; una grabación en
# public/assets/voz/<clave>.mp3 reemplaza a la voz del navegador (ej. voz/asentimiento.texto.mp3).
# {psicologo}: quien acompaña al niño (lo fija la institución). {nombre}: nombre del personaje.
# {figura}: nombre de una figura de la casa. {cuarto}: nombre de un cuarto.

asentimiento:
  texto: "Este juego tiene cuentos. {psicologo} va a ver lo que elijas para conocerte mejor. Tus maestros y tus compañeros no lo ven. Si algo nos preocupa de tu seguridad, {psicologo} buscará a adultos que te puedan cuidar. Puedes dejar de jugar cuando quieras."
  si: "Sí quiero jugar"
  no: "Ahora no"
  psicologo_prueba: "La persona que te acompaña"

creacion:
  inicio: "Vamos a hacer a tu personaje."
  espejo: "Aquí puedes cambiar a tu personaje."
  listo: "Listo"
  pasos:
