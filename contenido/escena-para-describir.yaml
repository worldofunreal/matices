  - [CASTIGO, "Lo castigaron y no puede salir"]
  - [MIRA_ALGO_BONITO, "Está viendo algo bonito afuera"]
  - [TIENE_MIEDO, "Tiene miedo de algo de afuera"]
pregunta_emocion: "¿Cómo se siente?"
