# Figuras para armar la casa (GDD §7). El id es el de su arte (public/assets/figuras/<id>.png y
# retrato_<id>.png) y el de su código en los sucesos (FIGURA:<id>).
# tipo: adulto | menor | mascota. "casa_adultos" en los sucesos usa solo los adultos; las mascotas
# viven en la casa pero no llegan en "¿Quién llega?".
