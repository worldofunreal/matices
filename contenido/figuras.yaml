  - [papa, adulto, "Papá"]
  - [tia, adulto, "Tía"]
  - [tio, adulto, "Tío"]
  - [madrastra, adulto, "Madrastra"]
  - [padrastro, adulto, "Padrastro"]
  - [otra_persona, adulto, "Otra persona adulta"]
  - [hermano_mayor, menor, "Hermano mayor"]
  - [hermana_mayor, menor, "Hermana mayor"]
  - [hermano_menor, menor, "Hermano menor"]
  - [hermana_menor, menor, "Hermana menor"]
  - [bebe, menor, "Bebé"]
  - [primo, menor, "Primo"]
